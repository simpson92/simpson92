<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FB"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#D6E2F0"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="260" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="560" width="640" height="260" fill="url(#dots)" mask="url(#m)"/>

  <!-- network motif -->
  <g stroke="#B9CDE6" stroke-width="1.6" fill="none">
    <path d="M760 70 L860 120 L980 80 L1080 140"/>
    <path d="M760 70 L820 190 L860 120"/>
    <path d="M860 120 L940 200 L1080 140"/>
    <path d="M980 80 L940 200"/>
    <path d="M820 190 L940 200"/>
  </g>
  <g fill="#FFFFFF" stroke="#7FA3CF" stroke-width="2">
    <circle cx="760" cy="70" r="7"/>
    <circle cx="820" cy="190" r="7"/>
    <circle cx="980" cy="80" r="7"/>
    <circle cx="940" cy="200" r="7"/>
  </g>
  <circle cx="860" cy="120" r="9" fill="#3B82C4"/>
  <!-- paw node -->
  <g transform="translate(1080 140)">
    <circle r="26" fill="#FFFFFF" stroke="#3B82C4" stroke-width="2"/>
    <g fill="#3B82C4">
      <ellipse cx="0" cy="6" rx="8.5" ry="7"/>
      <circle cx="-10" cy="-6" r="3.6"/>
      <circle cx="-3.5" cy="-11" r="3.6"/>
      <circle cx="3.5" cy="-11" r="3.6"/>
      <circle cx="10" cy="-6" r="3.6"/>
    </g>
  </g>

  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace">
    <text x="72" y="92" font-size="15" letter-spacing="3" fill="#3B82C4">AI · COMPUTER VISION</text>
    <text x="70" y="152" font-size="54" font-weight="700" fill="#1F2937">simpson92</text>
    <text x="72" y="196" font-size="18" fill="#6B7280">data → model → inspection, verified step by step</text>
  </g>
  <rect x="72" y="214" width="56" height="4" rx="2" fill="#3B82C4"/>
</svg>
