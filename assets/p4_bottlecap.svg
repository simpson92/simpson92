<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" rx="16" fill="#EDF3FA"/>
  <text x="32" y="46" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="2" fill="#3B74B5">RULE-BASED MACHINE VISION</text>
  <!-- conveyor -->
  <rect x="40" y="282" width="560" height="14" rx="7" fill="#C9D8EA"/>
  <g fill="#FFFFFF" stroke="#A9BFDA" stroke-width="2">
    <circle cx="70" cy="289" r="10"/><circle cx="570" cy="289" r="10"/>
  </g>
  <!-- bottle with cap (OK) -->
  <g transform="translate(22 0)">
    <rect x="128" y="118" width="40" height="24" rx="5" fill="#3B74B5"/>
    <path d="M132 142 h32 v18 c22 10 30 26 30 46 v68 c0 6 -4 8 -8 8 h-76 c-4 0 -8 -2 -8 -8 v-68 c0 -20 8 -36 30 -46 z" fill="#FFFFFF" stroke="#A9BFDA" stroke-width="2"/>
    <rect x="114" y="104" width="68" height="52" rx="6" fill="none" stroke="#3B74B5" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="114" y="208" width="68" height="28" rx="14" fill="#E7F4EC"/>
    <text x="134" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#2F8A52">OK</text>
  </g>
  <!-- bottle without cap (NG) -->
  <g transform="translate(10 0)">
    <path d="M312 142 h32 v18 c22 10 30 26 30 46 v68 c0 6 -4 8 -8 8 h-76 c-4 0 -8 -2 -8 -8 v-68 c0 -20 8 -36 30 -46 z" fill="#FFFFFF" stroke="#A9BFDA" stroke-width="2"/>
    <rect x="294" y="104" width="68" height="52" rx="6" fill="none" stroke="#D9534F" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="294" y="208" width="68" height="28" rx="14" fill="#FBEAEA"/>
    <text x="314" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#C2413D">NG</text>
  </g>
  <!-- measurement panel -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
    <rect x="426" y="96" width="176" height="160" rx="12" fill="#FFFFFF" stroke="#D3E0EF"/>
    <text x="444" y="124" fill="#9CA3AF" font-size="11" letter-spacing="1.5">AREA RATIO</text>
    <text x="444" y="152" fill="#1F2937">cap_on</text>
    <rect x="444" y="160" width="140" height="8" rx="4" fill="#E5EDF6"/>
    <rect x="444" y="160" width="93" height="8" rx="4" fill="#3B74B5"/>
    <text x="444" y="194" fill="#1F2937">cap_off</text>
    <rect x="444" y="202" width="140" height="8" rx="4" fill="#E5EDF6"/>
    <rect x="444" y="202" width="64" height="8" rx="4" fill="#D9534F"/>
    <path d="M495 155 v18 M495 197 v18" stroke="#1F2937" stroke-width="2"/>
    <text x="444" y="240" fill="#6B7280" font-size="11">threshold fixed first</text>
